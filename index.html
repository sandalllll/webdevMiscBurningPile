<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная №5 — Введение в Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #ddd;
      border-radius: 5px;
      cursor: pointer;
    }
    button.active {
      background: #42b883;
      color: white;
    }
    .task {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      margin-top: 8px;
      padding: 6px;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Лабораторная №5 — Введение в Vue</h1>

  <div class="tabs">
    <button
            v-for="(tab, i) in tabs"
            :key="i"
            :class="{ active: currentTab === i }"
            @click="currentTab = i"
    >
      Задание {{ i + 1 }}
    </button>
  </div>

  <div class="task">
    <component :is="tabs[currentTab]"></component>
  </div>
</div>

<script>
  const { createApp, ref, defineComponent} = Vue

  // --- ЗАДАНИЕ 1 ---
  const Task1 = defineComponent({
    data()
    {
      return { name: 'Bop' };
    },
    template:
    `
    <input v-model="name"><br>
    <span>Привет {{ name }}.</span>
    `
  })

  // --- ЗАДАНИЕ 2 ---
  const Task2 = defineComponent({
    setup()
    {
      const count = ref(0)
      return { count }
    },
    template:
    `
    <button @click="count++">Нажато {{ count }} раз.</button>
    `
  })

  // --- ЗАДАНИЕ 3 ---
  const Task3 = defineComponent({
    setup()
    {
      const showed = ref(true)
      return { showed }
    },
    template:
    `
    <button @click="showed = !showed">
      <span v-if="showed">
        Скрыть
      </span>
      <span v-if="!showed">
        Показать
      </span>
    </button><br>
    <img v-if="showed" src="dock.png"></img>
    `
  })

  // --- ЗАДАНИЕ 4 ---
  const Task4 = defineComponent({
    setup()
    {
      const aList = ref(["Мистраль", "Фён", "Пассат", "Бриз", "Муссон", "Самум", "Сирокко"])
      return { aList }
    },
    template:
    `
    <li v-for="(item, index) in aList">
      {{ index }}. {{ item }}.
    </li>
    `
  })

  // --- ЗАДАНИЕ 5 ---
  const Task5 = defineComponent({
    setup()
    {
      const username = ref();
      const userage = ref();
      const usersList = ref([]);
      const handleAdd = ref(function()
      {
        usersList.value.push({"username": username.value, "userage": userage.value});
      });
      const handleSubmit = ref(function()
      {
        usersList.value = [];
      });
      return { username, userage, usersList, handleAdd, handleSubmit }
    },
    template:
    `
    <form @submit.prevent="handleAdd">
      <input type="text" v-model="username" placeholder="имя">
      <input type='number' v-model="userage" placeholder="возраст">
      <button type="submit">Добавить</button>
    </form>
    <li v-for="(item, index) in usersList">
      {{ index }}. {{ item.username }} {{ item.userage }}.
    </li>
    <form @submit.prevent="handleSubmit">
      <button type="submit">Отправить</button>
    </form>
    `
  })

  // --- ЗАДАНИЕ 6 ---
  const Task6 = defineComponent({
    setup()
    {
      const nmb = ref(0)
      return { nmb }
    },
    template:
    `
    <input type="number" v-model="nmb"><br>
    <span>Оно: {{ nmb }}, квадрат: {{ nmb*nmb }}, куб: {{ nmb*nmb*nmb }}.</span>
    `
  })

  // --- ЗАДАНИЕ 7 ---
  const Task7 = defineComponent({
    setup()
    {
      const aList = ref(["Мистраль", "Фён", "Пассат", "Бриз", "Муссон"])
      return { aList }
    },
    template:
    `
    <li v-for="(item, index) in aList">
      {{ index }}. {{ item }}.
    </li>
    `
  })

  createApp({
    setup() {
      const currentTab = ref(0)
      const tabs = [Task1, Task2, Task3, Task4, Task5, Task6, Task7]
      return { currentTab, tabs }
    }
  }).mount('#app')
</script>
</body>
</html>
